<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CW1ZBVGSDL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CW1ZBVGSDL');
    </script>
        
    <title>Page Not Found - QRPeek</title>
    
    <!-- ลิงก์ไปยัง CSS ไฟล์เดียวกันกับหน้าหลัก -->
    <link rel="stylesheet" href="styles.css?v=1.2">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ใช้ Navbar เพื่อให้ผู้ใช้ยังนำทางได้ -->
    <header class="navbar">
        <div class="navbar-content">
            <div class="logo">QRPeek</div>
            <button class="hamburger" id="hamburger-button" aria-label="Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <nav class="nav-links" id="nav-links">
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/privacy.html">Privacy Policy</a>
            </nav>
        </div>
    </header>

    <!-- ใช้ <main> เหมือนเดิม แต่เราจะจัดกลางเนื้อหาด้วย CSS -->
    <main style="text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        
        <!-- เนื้อหา Error ที่ไม่ต้องการกรอบ -->
        <div>
            <h1 style="font-size: 6rem; color: var(--secondary-color); margin-bottom: 0; line-height: 1;">404</h1>
            <p style="font-size: 1.75rem; color: var(--secondary-color); margin-top: 0; margin-bottom: 2rem;">Page Not Found</p>
            <p>Sorry, we couldn't find the page you were looking for.</p>
            
            <!-- ใช้คลาส .btn ที่มีอยู่แล้วเพื่อให้ปุ่มหน้าตาเหมือนกัน -->
            <a href="/" class="btn upload-section" style="padding: 12px 24px; text-decoration: none; margin-top: 1rem; display: inline-block;">Go to Homepage</a>
        </div>

    </main>
    
    <!-- [ไม่บังคับ] จะมีหรือไม่มี Footer ก็ได้ในหน้านี้ ผมขอเอาออกเพื่อให้ดูคลีนขึ้น -->

    <!-- Script สำหรับ Hamburger Menu -->
    <script>
        const hamburgerButton = document.getElementById('hamburger-button');
        const navLinks = document.getElementById('nav-links');
        hamburgerButton.addEventListener('click', () => {
            hamburgerButton.classList.toggle('active');
            navLinks.style.maxHeight = navLinks.style.maxHeight ? null : navLinks.scrollHeight + "px";
        });
    </script>

</body>
</html>
